name: Toyota catalog daily

on:
  schedule:
    - cron: "0 12 * * *"  # 09:00 AR
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client pandas

      - name: Install Playwright (Chromium)
        run: |
          python -m playwright install chromium --with-deps

      - name: Write service_account.json (raw JSON, guarded)
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICE_ACCOUNT_JSON no está seteado o llegó vacío."
            exit 1
          fi
          printf '%s' "$SA_JSON" > service_account.json
          python - << 'PY'
import json,sys,os
p='service_account.json'
if not os.path.exists(p) or os.path.getsize(p)==0:
    print('ERROR: service_account.json no existe o está vacío'); sys.exit(1)
json.load(open(p,'r',encoding='utf-8'))
print('service_account.json OK')
PY

      - name: Run scraper
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ToyotaCatalogo
          SA_JSON_PATH: service_account.json
        run: |
          python toyota_scraper.py
