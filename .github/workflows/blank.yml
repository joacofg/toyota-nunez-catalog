name: Toyota catalog daily

on:
  schedule:
    # 12:00 UTC = 09:00 America/Argentina/Buenos_Aires
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # permite dispararlo manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client pandas

      - name: Install Playwright (Chromium)
        run: |
          python -m playwright install chromium --with-deps

      - name: Write service_account.json from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > service_account.json

      - name: Run scraper
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ToyotaCatalogo
          SA_JSON_PATH: service_account.json
        run: |
          python toyota_scraper.py

      # opcional: guarda logs/CSV si querés auditar
      - name: Upload artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-data
          path: |
            scraper.log
            toyota_catalogo.csv
